name: Build CleanMaster

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 还原依赖
        run: dotnet restore CleanMaster.csproj

      - name: 发布为单文件自包含 exe
        run: >
          dotnet publish CleanMaster.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish_output

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: CleanMaster-win-x64
          path: publish_output/CleanMaster.exe
          retention-days: 14
